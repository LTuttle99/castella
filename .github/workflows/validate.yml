name: Validate Castella integrated application
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test_scenario.js
      - run: node tests/test_conversation.js
      - run: node tests/test_history.js
      - run: node tests/test_integration.js
      - run: node tests/test_local_ai.js
      - run: node tests/test_browser_ai.js
      - run: node tests/test_operations_research.js
      - run: python3 scripts/operations_pipeline.py --check
      - run: python3 scripts/attendance_pipeline.py --check
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/build.py
